# Native build scripts are denied unless listed here (supply-chain hygiene).
# Platform binaries for these ship as optionalDependencies; the scripts only re-verify them.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
  # Downloads the ffmpeg binary that renders the social autopilot's reels (ADR 0040).
  ffmpeg-static: true
  unrs-resolver: false
