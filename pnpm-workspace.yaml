# Native build scripts are denied unless listed here (supply-chain hygiene).
# Platform binaries for these ship as optionalDependencies; the scripts only re-verify them.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
  # Downloads the ffmpeg binary that renders the social autopilot's reels (ADR 0040).
  ffmpeg-static: true
  # The CPU builds for every platform ship inside the package; the script only fetches optional CUDA files
  # (dish cut-outs run on the CPU, ADR 0057).
  onnxruntime-node: false
  # Only a version notice.
  protobufjs: false
  unrs-resolver: false
  # Platform binary ships as an optionalDependency; the script only re-verifies it (Cloudflare move).
  workerd: false
